[package]
name = "powertimer"
version = "0.8.0"
description = "PowerTimer — Tauri Edition"
authors = ["PowerTimer contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "powertimer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
